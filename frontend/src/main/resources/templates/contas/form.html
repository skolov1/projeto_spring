<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(${contaId != null ? 'Editar Conta' : 'Nova Conta'}, ~{::section})}">
<body>
<section>
    <div class="page-header">
        <h1 class="page-title" th:text="${contaId != null ? 'Editar Conta' : 'Nova Conta'}">Nova Conta</h1>
        <a class="btn btn-ghost" th:href="@{/contas}">Voltar</a>
    </div>

    <div class="card" style="max-width: 540px;">
        <form th:action="${contaId != null} ? @{/contas/{id}(id=${contaId})} : @{/contas}"
              th:object="${conta}" method="post">

            <div class="form-group">
                <label class="form-label" for="nome">Nome da Conta</label>
                <input class="form-control" type="text" id="nome" th:field="*{nome}"
                       placeholder="Ex: Nubank, Carteira, Itaú" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="tipo">Tipo de Conta</label>
                <select class="form-control" id="tipo" th:field="*{tipo}" required>
                    <option value="CORRENTE">Conta Corrente</option>
                    <option value="POUPANCA">Poupança</option>
                    <option value="CARTEIRA">Carteira</option>
                    <option value="INVESTIMENTO">Investimento</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label" for="saldoInicial">Saldo Inicial (R$)</label>
                <input class="form-control" type="number" step="0.01" id="saldoInicial"
                       th:field="*{saldoInicial}" placeholder="0.00" required>
            </div>

            <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="submit" class="btn">Salvar Conta</button>
                <a class="btn btn-ghost" th:href="@{/contas}">Cancelar</a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
