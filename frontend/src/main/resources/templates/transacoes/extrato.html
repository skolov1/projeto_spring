<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina('Extrato - ' + ${conta.nome}, ~{::section})}">
<body>
<section>
    <div class="page-header">
        <div>
            <h1 class="page-title" th:text="${conta.nome}">Nome da Conta</h1>
            <span class="badge" th:text="${conta.tipo}">Corrente</span>
        </div>
        <a class="btn btn-ghost" th:href="@{/contas}">Voltar para Contas</a>
    </div>

    <div class="summary-grid" th:if="${saldo != null}">
        <div class="card">
            <span class="card-label">Saldo Atual</span>
            <span class="card-value text-accent"
                  th:text="${#numbers.formatCurrency(saldo.saldoAtual)}">R$ 0,00</span>
        </div>
        <div class="card">
            <span class="card-label">Total Receitas</span>
            <span class="card-value text-income"
                  th:text="${#numbers.formatCurrency(saldo.totalReceitas)}">R$ 0,00</span>
        </div>
        <div class="card">
            <span class="card-label">Total Despesas</span>
            <span class="card-value text-expense"
                  th:text="${#numbers.formatCurrency(saldo.totalDespesas)}">R$ 0,00</span>
        </div>
    </div>

    <div class="card" style="margin-bottom: 2rem;">
        <h2 class="account-name" style="margin-bottom: 1rem;">Novo Lançamento</h2>
        <form th:action="@{/contas/{id}/transacoes(id=${conta.id})}"
              th:object="${novaTransacao}" method="post"
              style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; align-items: end;">

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" for="descricao">Descrição</label>
                <input class="form-control" type="text" id="descricao" th:field="*{descricao}"
                       placeholder="Ex: Salário, Mercado" required>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" for="valor">Valor (R$)</label>
                <input class="form-control" type="number" step="0.01" min="0.01" id="valor"
                       th:field="*{valor}" placeholder="0.00" required>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" for="tipo">Tipo</label>
                <select class="form-control" id="tipo" th:field="*{tipo}" required>
                    <option value="RECEITA">Receita (+)</option>
                    <option value="DESPESA">Despesa (-)</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" for="categoria">Categoria</label>
                <input class="form-control" type="text" id="categoria" th:field="*{categoria}"
                       placeholder="Ex: Alimentação" required>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label class="form-label" for="data">Data</label>
                <input class="form-control" type="date" id="data" th:field="*{data}" required>
            </div>

            <div>
                <button type="submit" class="btn" style="width: 100%;">Adicionar</button>
            </div>
        </form>
    </div>

    <div class="card" th:if="${#lists.isEmpty(transacoes)}">
        <p class="card-label">Nenhuma transação registrada nesta conta.</p>
    </div>

    <table class="table" th:if="${!#lists.isEmpty(transacoes)}">
        <thead>
            <tr>
                <th>Data</th>
                <th>Descrição</th>
                <th>Categoria</th>
                <th>Tipo</th>
                <th>Valor</th>
                <th>Ação</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="t : ${transacoes}">
                <td th:text="${t.data}">2026-01-01</td>
                <td th:text="${t.descricao}">Descrição</td>
                <td><span class="badge" th:text="${t.categoria}">Categoria</span></td>
                <td th:text="${t.tipo}">RECEITA</td>
                <td th:classappend="${t.tipo == 'RECEITA'} ? 'text-income' : 'text-expense'"
                    style="font-weight: 600;"
                    th:text="${(t.tipo == 'RECEITA' ? '+ ' : '- ') + #numbers.formatCurrency(t.valor)}">R$ 0,00</td>
                <td>
                    <form th:action="@{/contas/{contaId}/transacoes/{id}/excluir(contaId=${conta.id}, id=${t.id})}"
                          method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Excluir esta transação?');">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</section>
</body>
</html>
